name: Build News Trading cBot

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NewsTradingBot.csproj

      - name: Build
        run: dotnet build NewsTradingBot.csproj --configuration Release --no-restore

      - name: Find cBot
        run: find . -type f -name "*.algo" -print

      - name: Upload cBot
        uses: actions/upload-artifact@v4
        with:
          name: NewsTradingBot-algo
          path: "**/*.algo"
          if-no-files-found: error